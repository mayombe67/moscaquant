[experiment]
id = "mq5-2-matched-noncausal-43417-to-656-v1"
phase = "MQ-5.2"
classification = "confirmatory-control"

[source]
model_index = 43417
target_model_index = 656
match_frame = 145

[eligibility]
exclude_frozen_causal_nodes = true
exclude_direct_edge_to_target = true
require_same_functional_class = true
require_same_graded_type_if_applicable = true
require_positive_activity_at_match_frame = true

[acceptance]
# Ratios are candidate / source.
minimum_activity_ratio = 0.5
maximum_activity_ratio = 2.0

minimum_in_degree_ratio = 0.5
maximum_in_degree_ratio = 2.0

minimum_out_degree_ratio = 0.5
maximum_out_degree_ratio = 2.0

[ranking]
# Applied only after all eligibility and acceptance rules pass.
#
# score =
#   |ln(candidate_activity / source_activity)|
# + |ln((candidate_in_degree + 1) / (source_in_degree + 1))|
# + |ln((candidate_out_degree + 1) / (source_out_degree + 1))|
#
# Lowest score wins.
#
# model index is the deterministic tie breaker.
activity_weight = 1.0
in_degree_weight = 1.0
out_degree_weight = 1.0
tie_breaker = "lowest_model_index"

[control]
attenuation = 1.0
start_frame = 145
end_frame = 145

[guardrails]
use_intervention_outcomes_for_selection = false
financial_semantics_used = false
biological_causality_claim = false
