[experiment]
id = "mq5-2-matched-noncausal-43417-to-656-v1"
phase = "MQ-5.2"
classification = "confirmatory-control"

[source]
model_index = 43417
target_model_index = 656
match_frame = 145

[eligibility]
exclude_frozen_causal_nodes = true
exclude_direct_edge_to_target = true
require_same_functional_class = true
require_same_graded_type_if_applicable = true
require_positive_activity_at_match_frame = true

[acceptance]
# Ratios are candidate / source.
# Amendment 1:
# Initial 0.5–2.0 windows produced zero eligible candidates.
# Expanded prospectively before the second candidate search.
minimum_activity_ratio = 0.25
maximum_activity_ratio = 4.0

# Amendment 2:
# Degree is no longer an eligibility constraint.
# It remains a secondary ranking dimension.
minimum_in_degree_ratio = 0.0
maximum_in_degree_ratio = 999999.0

minimum_out_degree_ratio = 0.0
maximum_out_degree_ratio = 999999.0

[ranking]
# Applied only after all eligibility and acceptance rules pass.
#
# Amendment 2 ranking:
#
# Primary:
#   |ln(candidate_activity / source_activity)|
#
# Secondary:
#   |ln((candidate_in_degree + 1) / (source_in_degree + 1))|
# + |ln((candidate_out_degree + 1) / (source_out_degree + 1))|
#
# Final deterministic tie breaker:
#   lowest model index
ranking_method = "activity_then_degree_then_model_index"

[control]
attenuation = 1.0
start_frame = 145
end_frame = 145

[guardrails]
use_intervention_outcomes_for_selection = false
financial_semantics_used = false
biological_causality_claim = false
